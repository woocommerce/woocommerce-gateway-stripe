name: Bundle Size

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch to compare against'
        default: 'trunk'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Check for code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/detect-code-changes

  measure-head:
    name: Build & measure (head)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/measure-bundle-sizes
        with:
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          side: head

  measure-base:
    name: Build & measure (base)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.base_ref || 'trunk' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get merge base SHA
        id: base-sha
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch origin "${{ env.BASE_REF }}"
          MERGE_BASE=$(git merge-base "$HEAD_SHA" "origin/${{ env.BASE_REF }}")
          echo "sha=$MERGE_BASE" >> $GITHUB_OUTPUT

      - uses: ./.github/actions/measure-bundle-sizes
        with:
          commit-sha: ${{ steps.base-sha.outputs.sha }}
          side: base

  compare:
    name: Compare & report
    needs: [measure-head, measure-base]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-sizes-head
          path: artifacts/head

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-sizes-base
          path: artifacts/base

      - name: Compare bundle sizes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.base_ref || 'trunk' }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          node .github/scripts/compare-bundle-sizes.js \
            artifacts/base/sizes.json \
            artifacts/head/sizes.json \
            report.md

      - name: Check for report
        id: check-report
        run: |
          if [ -f report.md ]; then
            echo "has_report=true" >> $GITHUB_OUTPUT
          fi

      - name: Write to job summary
        if: steps.check-report.outputs.has_report == 'true'
        run: cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Find existing bundle size comment (pull_request)
        if: github.event_name == 'pull_request' && steps.check-report.outputs.has_report == 'true'
        id: find-comment-pr
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- bundle-size-report -->'

      - name: Post or update PR comment (pull_request)
        if: github.event_name == 'pull_request' && steps.check-report.outputs.has_report == 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment-pr.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: report.md
          edit-mode: replace

      - name: Find PR for branch (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.check-report.outputs.has_report == 'true'
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // ""')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find existing bundle size comment (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.check-report.outputs.has_report == 'true' && steps.find-pr.outputs.pr_number != ''
        id: find-comment-dispatch
        continue-on-error: true
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ steps.find-pr.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- bundle-size-report -->'

      - name: Post or update PR comment (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.check-report.outputs.has_report == 'true' && steps.find-pr.outputs.pr_number != ''
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment-dispatch.outputs.comment-id }}
          issue-number: ${{ steps.find-pr.outputs.pr_number }}
          body-path: report.md
          edit-mode: replace
