name: Format Release Notes

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to format release notes for (e.g., release/10.4.0)'
        type: string
        required: true

run-name: Format release notes for ${{ inputs.branch }}

jobs:
  format-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Format release notes with Claude
        uses: ./.github/actions/format-release-notes
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 #v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: readme.txt
          commit-message: Reorganize changelog entries for release
          branch: format-release-notes/${{ inputs.branch }}
          base: ${{ inputs.branch }}
          title: "Reorganize release notes for ${{ inputs.branch }}"
          body: |
            This PR reorganizes the changelog entries in `readme.txt` under the standard release note headings:

            - **New Features**
            - **Important Fixes and Updates**
            - **Other Fixes and Updates**
            - **Internal Changes and Upcoming Features**

            Generated automatically by Claude Code.

            ## Testing instructions
            Review the contents of the various sections and ensure entries are under the right headings.
          labels: changelog
