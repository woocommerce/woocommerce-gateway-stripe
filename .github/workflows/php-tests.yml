name: PHP tests

on:
  pull_request

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        woocommerce_support_policy: [ 'L', 'L-1', 'L-2' ]
        wordpress_support_policy:   [ 'L', 'L-1', 'L-2' ]
        php_support_policy:         [ 'L', 'L-1', 'L-2' ]
        include:
          # WooCommerce
          - woocommerce_support_policy: L
            woocommerce: '9.7.1'
          - woocommerce_support_policy: L-1
            woocommerce: '9.6.2'
          - woocommerce_support_policy: L-2
            woocommerce: '9.5.2'
          # WordPress
          - wordpress_support_policy: L
            wordpress: '6.7.2'
          - wordpress_support_policy: L-1
            wordpress: '6.6.2'
          - wordpress_support_policy: L-2
            wordpress: '6.5.5'
          # PHP
          - php_support_policy: L
            php: '8.1'
          - php_support_policy: L-1
            php: '8.0'
          - php_support_policy: L-2
            php: '7.4'

        exclude: # incompatible versions of PHP, WordPress, and WooCommerce
          # WC 9.5 requires at least WP 6.6, so we have to exclude WP 6.5 (L-2)
          - wordpress_support_policy: L-2

    name: Stable
    uses: ./.github/workflows/run-unit-tests.yml
    with:
      name: WP=${{ matrix.wordpress_support_policy }}, WC=${{ matrix.woocommerce_support_policy }}, PHP=${{ matrix.php_support_policy }}
      wp-version: ${{ matrix.wordpress }}
      wc-version: ${{ matrix.woocommerce }}
      php-version: ${{ matrix.php }}
