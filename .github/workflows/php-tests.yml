name: PHP tests

on:
  pull_request

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast:    false
      max-parallel: 10
      matrix:
        woocommerce_support_policy: [ 'L', 'L-1', 'L-2' ]
        wordpress_support_policy:   [ 'L', 'L-1', 'L-2' ]
        php_support_policy:         [ 'L', 'L-1', 'L-2' ]
        include:
          # WooCommerce
          - woocommerce_support_policy: L
            woocommerce: '9.1.2'
          - woocommerce_support_policy: L-1
            woocommerce: '9.0.2'
          - woocommerce_support_policy: L-2
            woocommerce: '8.9.3'
          # WordPress
          - wordpress_support_policy: L
            wordpress: '6.6'
          - wordpress_support_policy: L-1
            wordpress: '6.5'
          - wordpress_support_policy: L-2
            wordpress: '6.4'
          # PHP
          - php_support_policy: L
            php: '8.1'
          - php_support_policy: L-1
            php: '8.0'
          - php_support_policy: L-2
            php: '7.4'

    name: Stable (PHP=${{ matrix.php_support_policy }}, WP=${{ matrix.wordpress_support_policy }}, WC=${{ matrix.woocommerce_support_policy }})
    env:
      PHP_VERSION: ${{ matrix.php }} 
      WP_VERSION:  ${{ matrix.wordpress }}
      WC_VERSION:  ${{ matrix.woocommerce }}
    steps:
      - name: Testing with PHP=${{ matrix.php }}, WP=${{ matrix.wordpress }}, WC=${{ matrix.woocommerce }}
        uses: actions/checkout@v2

      - name: Set up dependencies caching
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage:    xdebug

      - name: If PHP >= 8.0 set up PHPUnit 9.5 for compatibility
        if: ${{ matrix.php >= '8.0' }}
        run: wget https://phar.phpunit.de/phpunit-9.5.28.phar && mv phpunit-9.5.28.phar phpunit.phar
        
      - name: Run CI checks
        run: bash bin/run-ci-tests.bash
        
      - name: Code Coverage Report
        if: ${{ matrix.php == '8.1' && matrix.wordpress == '6.6' && matrix.woocommerce == '9.1.2' }} # Run only on the latest versions
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Get Changed Files
        id: get-changed-files
        uses: jitterbit/get-changed-files@v1
        with:
          format: 'space-delimited'
          
      - name: Filter Changed Files in Coverage
        if: ${{ steps.get-changed-files.outputs.all }}
        run: |
          for changed_file in ${{ steps.get-changed-files.outputs.all }}; do
            cat code-coverage-results.md | grep ${changed_file} >> code-coverage-results-filtered.md
          done
      
      - name: Add Coverage PR Comment
        if: ${{ steps.get-changed-files.outputs.all && matrix.php == '8.1' && matrix.wordpress == '6.6' && matrix.woocommerce == '9.1.2' }} # Run only on the latest versions
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results-filtered.md
          
