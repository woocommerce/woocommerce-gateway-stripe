name: PHP Code Coverage

on:
  pull_request

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      PHP_VERSION: '8.1'
      WP_VERSION: '6.6'
      WC_VERSION: '9.1.2'
    steps:
      - name: Checking out
        uses: actions/checkout@v2

      - name: Set up dependencies caching
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/
          key:  ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage:    xdebug

      - name: Set up PHPUnit 9.5 for compatibility
        run: wget https://phar.phpunit.de/phpunit-9.5.28.phar && mv phpunit-9.5.28.phar phpunit.phar
        
      - name: Run CI checks
        run: bash bin/run-ci-tests.bash
        
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
          
      - name: Get Changed Files
        id: get-changed-files
        uses: hanseltimeindustries/get-changed-files@v1
        with:
          format: 'space-delimited'
          filter: '**/includes/**/*'
          
      - name: Filter Changed Files in Report
        if: ${{ steps.get-changed-files.outputs.all }} # Only run if there are changed files
        run: |
          echo -e "Package | Line Rate | Health" > code-coverage-results-filtered.md 
          echo "-------- | --------- | ------" >> code-coverage-results-filtered.md
          grep -E "$(echo ${{ steps.get-changed-files.outputs.all }} | tr ' ' '|')" code-coverage-results.md >> code-coverage-results-filtered.md
          tail -n1 code-coverage-results.md >> code-coverage-results-filtered.md
      
      - name: Add Coverage PR Comment
        if: ${{ steps.get-changed-files.outputs.all }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results-filtered.md
          
