name: 'Auto-resolve changelog conflicts'

# Merges develop into same-repository pull requests that target develop when the
# only conflicts are in changelog.txt and/or readme.txt, resolving them with
# bin/resolve-changelog-conflicts.js. Every other conflict is left for a person.
#
# pull_request_target, not pull_request: pull_request workflows do not run while
# a pull request has a merge conflict, which is exactly when this is needed. It
# runs in the base branch context with a write-capable token, so nothing from
# the pull request is installed or executed: both scripts are checked out from
# develop, and git only merges file contents.
#
# Pushes need a GitHub App token (CHANGELOG_BOT_CLIENT_ID and
# CHANGELOG_BOT_PRIVATE_KEY): pushes made with GITHUB_TOKEN don't start CI on the
# merge commit, and GITHUB_TOKEN can never push a merge that brings in workflow
# file changes from develop. Without the secrets it falls back to GITHUB_TOKEN.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-resolve-changelog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: 'Resolve changelog conflicts'
    # A workflow token can't push to a fork's branch, and Dependabot PRs have no
    # changelog entries.
    if: >-
      github.event_name != 'pull_request_target' || (
        github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_APP_TOKEN: ${{ secrets.CHANGELOG_BOT_CLIENT_ID != '' }}
    steps:
      - name: Create GitHub App token
        id: app-token
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHANGELOG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          # Merging develop can bring in workflow file changes; pushing those
          # needs this permission.
          permission-workflows: write

      - name: Check out the scripts from develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          path: trusted
          sparse-checkout: |
            bin/auto-resolve-changelog-conflicts.sh
            bin/resolve-changelog-conflicts.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the repository to merge in
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          path: work
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Resolve conflicts
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SCRIPT: ${{ github.workspace }}/trusted/bin/auto-resolve-changelog-conflicts.sh
          RESOLVER: ${{ github.workspace }}/trusted/bin/resolve-changelog-conflicts.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$EVENT_NAME" = 'pull_request_target' ]; then
            prs="${PR_NUMBER} ${HEAD_REF}"
          else
            # A push to develop can create conflicts on any open pull request.
            # Mergeability is recomputed lazily after a push, so try each one
            # rather than filtering on it.
            prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --state open --limit 200 \
              --json number,headRefName,isCrossRepository,author \
              --jq '.[] | select(.isCrossRepository | not) | select(.author.login != "app/dependabot") | "\(.number) \(.headRefName)"')"
          fi

          # One bash process per pull request, so a failure on one doesn't stop
          # the rest (bash ignores set -e inside a function called from ||).
          while read -r number head_ref; do
            [ -n "$number" ] || continue
            echo "::group::#${number} (${head_ref})"
            bash "$SCRIPT" "$number" "$head_ref" || echo "::warning::#${number}: auto-resolve failed; see the log above."
            echo "::endgroup::"
          done <<< "$prs"
