name: 'Auto-resolve changelog conflicts'

# Merges develop into same-repo PRs to develop when the only conflicts are in
# changelog.txt/readme.txt, resolving them with bin/resolve-changelog-conflicts.js.
# Other conflicts are left for a person. Uses pull_request_target, not pull_request,
# because pull_request workflows don't run while a PR is conflicted (exactly when this
# is needed); it runs in the base context and never runs PR code (both scripts come from
# a develop checkout, git only merges contents). Pushes need a GitHub App token
# (CHANGELOG_BOT_CLIENT_ID/_PRIVATE_KEY); without it, falls back to GITHUB_TOKEN, which
# won't start CI on the merge or push workflow-file changes.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-resolve-changelog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: 'Resolve changelog conflicts'
    # A workflow token can't push to a fork's branch, and Dependabot PRs have no
    # changelog entries.
    if: >-
      github.event_name != 'pull_request_target' || (
        github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_APP_TOKEN: ${{ secrets.CHANGELOG_BOT_CLIENT_ID != '' }}
    steps:
      - name: Create GitHub App token
        id: app-token
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHANGELOG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          # To push a merge that brings in workflow-file changes from develop.
          permission-workflows: write

      - name: Check out the scripts from develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          path: trusted
          sparse-checkout: |
            bin/auto-resolve-changelog-conflicts.sh
            bin/resolve-changelog-conflicts.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the repository to merge in
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          path: work
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Resolve conflicts
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SCRIPT: ${{ github.workspace }}/trusted/bin/auto-resolve-changelog-conflicts.sh
          RESOLVER: ${{ github.workspace }}/trusted/bin/resolve-changelog-conflicts.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$EVENT_NAME" = 'pull_request_target' ]; then
            prs="${PR_NUMBER} ${HEAD_REF}"
          else
            # A develop push can conflict any open PR, and mergeability is stale right
            # after a push, so try each one rather than filtering on it.
            prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --state open --limit 200 \
              --json number,headRefName,isCrossRepository,author \
              --jq '.[] | select(.isCrossRepository | not) | select(.author.login != "app/dependabot") | "\(.number) \(.headRefName)"')"
          fi

          # One bash process per PR, so one failure doesn't stop the rest.
          while read -r number head_ref; do
            [ -n "$number" ] || continue
            echo "::group::#${number} (${head_ref})"
            bash "$SCRIPT" "$number" "$head_ref" || echo "::warning::#${number}: auto-resolve failed; see the log above."
            echo "::endgroup::"
          done <<< "$prs"
