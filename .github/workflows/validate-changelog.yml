name: 'Validate Changelog'

on:
  pull_request:
    # `edited` re-runs the check when the exemption checkbox in the description is ticked, and
    # `labeled`/`unlabeled` when the `changelog` label is added or removed.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches:
      - trunk
      - develop
      - 'release/**'

jobs:
  check_changelog:
    name: 'Check for changelog updates'
    # Dependabot cannot tick the exemption checkbox, so the job would be red on
    # every dependency PR.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request is checked out as its merge commit. Its first parent is the current tip
          # of the target branch, which is what the steps below compare against; the base SHA in the
          # event payload can be older than that and would report the target branch's own changes.
          fetch-depth: 2

      - name: Classify pull request
        id: classify
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          HAS_CHANGELOG_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'changelog') }}
        run: |
          # Pull requests that are expected to write changelog.txt and readme.txt themselves: the
          # compiled changelog and release notes (labelled `changelog` by the workflows that open
          # them), and the merges that carry a release back to trunk and develop.
          compiles_changelog=false
          if [ "$HAS_CHANGELOG_LABEL" = "true" ]; then
            compiles_changelog=true
          fi
          case "$HEAD_REF" in
            release/*|trunk|release-changelog/*|format-release-notes/*) compiles_changelog=true ;;
          esac

          is_exempt=false
          if printf '%s' "$PR_BODY" | grep -qiE -- '- *\[x\] *This Pull Request does not require a changelog entry'; then
            is_exempt=true
          fi

          touches_entries=false
          if ! git diff --quiet HEAD^1 HEAD -- changelog/; then
            touches_entries=true
          fi

          {
            echo "compiles_changelog=$compiles_changelog"
            echo "is_exempt=$is_exempt"
            echo "touches_entries=$touches_entries"
          } >> "$GITHUB_OUTPUT"

      - name: Require a changelog entry file
        if: steps.classify.outputs.compiles_changelog != 'true' && steps.classify.outputs.is_exempt != 'true'
        run: |
          # Dotfiles are not entries: changelog/.gitkeep only keeps the directory in git.
          added=$(git diff --name-only --diff-filter=A HEAD^1 HEAD -- changelog/ | grep -v '^changelog/\.' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR requires a changelog entry. Run \`npm run changelog\` and commit the file it creates under changelog/, or check \"This Pull Request does not require a changelog entry\" in the PR description if no changelog is needed."
            exit 1
          fi
          echo "Changelog entry file(s) found ✅"
          echo "$added"

      - name: Reject direct edits to the compiled changelog
        if: steps.classify.outputs.compiles_changelog != 'true'
        run: |
          failed=false

          if ! git diff --quiet HEAD^1 HEAD -- changelog.txt; then
            echo "::error file=changelog.txt::changelog.txt is compiled from the files in changelog/ at release time. Remove this edit and run \`npm run changelog\` instead."
            failed=true
          fi

          # The rest of readme.txt (description, Compatibility Notes, Stable tag) is still edited by hand.
          readme_changelog() {
            git show "$1:readme.txt" | sed -n '/^== Changelog ==$/,$p'
          }
          if [ "$(readme_changelog HEAD^1)" != "$(readme_changelog HEAD)" ]; then
            echo "::error file=readme.txt::The Changelog section of readme.txt is compiled from the files in changelog/ at release time. Remove this edit and run \`npm run changelog\` instead."
            failed=true
          fi

          if [ "$failed" = "true" ]; then
            echo "If this PR is meant to edit the compiled changelog (for example to correct a released entry), add the \`changelog\` label."
            exit 1
          fi
          echo "No direct edits to the compiled changelog ✅"

      - name: Add composer to cache
        if: steps.classify.outputs.touches_entries == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/composer/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Set up PHP
        if: steps.classify.outputs.touches_entries == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '7.4'
          tools: composer
          coverage: none

      - name: Validate changelog entry files
        if: steps.classify.outputs.touches_entries == 'true'
        run: |
          composer install --no-progress
          ./vendor/bin/changelogger validate --gh-action
