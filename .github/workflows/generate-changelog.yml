name: 'Generate changelog'

on:
  pull_request:
    types: [edited]
    branches:
      - trunk
      - develop

permissions: {}

jobs:
  generate_changelog:
    name: 'Generates a changelog entry'
    runs-on: ubuntu-20.04
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: 'Collect changelog data from PR description'
        run: |
          chmod +x .github/actions/add-changelog-entry/generate-changelog.sh
          .github/actions/add-changelog-entry/generate-changelog.sh -p "${{ github.event.pull_request.body }}" -o $GITHUB_OUTPUT
        id: collect_changelog_data

      - name: 'Check commit history'
        uses: actions/github-script@v7
        id: check_history
        with:
          script: |
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Look for bot commits
            const botCommits = commits.data.filter(commit => 
              commit.commit.author.name === 'bot-wc-stripe' && 
              commit.commit.message.startsWith('Add changelog entry for PR')
            );
            
            if (botCommits.length === 0) {
              core.info('No previous changelog commits found - will add new entry');
              return 'add';
            }
            
            // Get the latest bot commit
            const latestBotCommit = botCommits[botCommits.length - 1];
            
            // Get the tree of the latest bot commit to check changelog content
            const tree = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: latestBotCommit.sha,
              recursive: true
            });
            
            // Find changelog.txt in the tree
            const changelogBlob = tree.data.tree.find(item => item.path === 'changelog.txt');
            if (!changelogBlob) {
              core.info('Could not find changelog.txt in previous commit - will add new entry');
              return 'add';
            }
            
            // Get the content of changelog.txt from the previous bot commit
            const previousChangelog = await github.rest.git.getBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              file_sha: changelogBlob.sha
            });
            
            // Compare with new changelog entry
            const newEntry = '${{ steps.collect_changelog_data.outputs.CHANGELOG_ENTRY }}';
            const previousContent = Buffer.from(previousChangelog.data.content, 'base64').toString();
            
            if (!previousContent.includes(newEntry)) {
              core.info('Changelog content changed - will update entry');
              return 'update';
            }
            
            core.info('No changelog changes needed');
            return 'skip';

      - name: 'Add changelog entry to changelog.txt'
        if: steps.check_history.outputs.result == 'add' || steps.check_history.outputs.result == 'update'
        uses: ./.github/actions/add-changelog-entry
        with:
          CHANGELOG_ENTRY: ${{ steps.collect_changelog_data.outputs.CHANGELOG_ENTRY }}
          FILENAME: './changelog.txt'

      - name: 'Add changelog entry to readme.txt'
        if: steps.check_history.outputs.result == 'add' || steps.check_history.outputs.result == 'update'
        uses: ./.github/actions/add-changelog-entry
        with:
          CHANGELOG_ENTRY: ${{ steps.collect_changelog_data.outputs.CHANGELOG_ENTRY }}
          FILENAME: './readme.txt'

      - name: 'Commit changes'
        if: steps.check_history.outputs.result == 'add' || steps.check_history.outputs.result == 'update'
        run: |
            git config user.name "bot-wc-stripe"
            git config user.email "bot-wc-stripe@users.noreply.github.com"
            git add changelog.txt
            git add readme.txt
            git commit -m "Add changelog entry for PR ${{ github.event.pull_request.number }}"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
        id: commit_changes