name: E2E tests

on:
  pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/detect-code-changes

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        theme: ['storefront']
        project: ['default', 'isk', 'acss', 'optimized-checkout', 'adaptive-pricing', 'blik', 'becs']
        # Additionally run the theme-sensitive checkout projects under a block
        # theme (purple, fetched from the woo-themes repo) to catch block-theme
        # regressions. The payment-method-specific projects are theme-independent,
        # so they only run on the classic theme above.
        include:
          - theme: 'purple'
            project: 'default'
          - theme: 'purple'
            project: 'optimized-checkout'

    name: E2E - ${{ matrix.project }} (${{ matrix.theme }}) WP=latest, WC=latest, PHP=7.4
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PHP

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 7.4
          tools: composer
          coverage: none

      - name: Cache Composer deps
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

      - name: Install composer dependencies
        if: ${{ steps.composer-cache.outputs.cache-hit == false }}
        shell: bash
        run: composer install --no-progress

      # Node

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache Node deps
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ./node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install node dependencies
        if: ${{ steps.node-cache.outputs.cache-hit == false }}
        shell: bash
        run: npm ci

      # Build

      - name: Build plugin package
        shell: bash
        run: |
          npm run build

      # E2E test environment

      - name: Prepare test environment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          STRIPE_PUB_KEY: ${{ matrix.project == 'blik' && secrets.E2E_STRIPE_PUBLISHABLE_KEY_PL || matrix.project == 'becs' && secrets.E2E_STRIPE_PUBLISHABLE_KEY_AU || secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ matrix.project == 'blik' && secrets.E2E_STRIPE_SECRET_KEY_PL || matrix.project == 'becs' && secrets.E2E_STRIPE_SECRET_KEY_AU || secrets.E2E_STRIPE_SECRET_KEY }}
          WP_THEME: ${{ matrix.theme }}
          # Pinned to a woo-themes commit so theme drift on trunk cannot silently
          # change CI. Bump this SHA to pick up newer purple revisions.
          WP_THEME_TARBALL_URL: ${{ matrix.theme == 'purple' && 'https://codeload.github.com/woocommerce/woo-themes/tar.gz/b08c586054a411c3a93c76bba4f0174335e8060d' || '' }}
        run: npm run test:e2e-setup

      - name: Upload e2e setup logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: E2E-${{ matrix.project }}-${{ matrix.theme }}-WP_latest-WC_latest-setup-logs
          path: tests/e2e/e2e-setup.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run E2E tests
        env:
          STRIPE_PUB_KEY: ${{ matrix.project == 'blik' && secrets.E2E_STRIPE_PUBLISHABLE_KEY_PL || matrix.project == 'becs' && secrets.E2E_STRIPE_PUBLISHABLE_KEY_AU || secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ matrix.project == 'blik' && secrets.E2E_STRIPE_SECRET_KEY_PL || matrix.project == 'becs' && secrets.E2E_STRIPE_SECRET_KEY_AU || secrets.E2E_STRIPE_SECRET_KEY }}
        run: npm run test:e2e-run -- --project=${{ matrix.project }}

      - name: Upload E2E-${{ matrix.project }}-${{ matrix.theme }}-WP_latest-WC_latest-results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: E2E-${{ matrix.project }}-${{ matrix.theme }}-WP_latest-WC_latest-results
          path: tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
