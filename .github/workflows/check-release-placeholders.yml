name: 'Check released version placeholders'

# woorelease replaces x.x.x version placeholders while it cuts a release. If the
# phar that cut it is too old for a placeholder style, or a path is missing from
# config.version_replace_paths, the release ships a literal x.x.x. This checks
# the released tag right after publishing, so a patch release can follow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to check'
        required: true

permissions:
  contents: read

jobs:
  check:
    name: 'Check for unreplaced x.x.x'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch's script, with full history so any tag can be checked,
      # including ones from before the script existed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      # the script has no dependencies, so no npm ci
      - run: node bin/check-version-placeholders.js --tree "$REF"
        env:
          REF: ${{ github.event.release.tag_name || inputs.ref }}

  handle-error:
    if: ${{ failure() }}
    needs: check
    name: Handle failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            icon: ":workflow-failed:"
            status: "failed"
            workflowName: "${{ github.workflow }}"
            workflowUrl: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
