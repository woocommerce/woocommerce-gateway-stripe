name: PHP Code Coverage Comment
description: Composite Action with steps to add a comment to a PR with PHP Code Coverage results

inputs:
  php-version:
    description: PHP version to use
    type: string
    default: ''

runs:
  using: "composite"
  steps:
    - name: Checking out
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: Set up dependencies caching
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/composer/
        key:  ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

    - name: Cache WordPress core and test suite
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          /tmp/wordpress
          /tmp/wordpress-tests-lib
        key: wp-testenv-${{ runner.os }}-${{ env.WP_VERSION }}-wc-${{ env.WC_VERSION }}-${{ hashFiles('bin/install-wp-tests.sh', 'bin/run-ci-tests.bash') }}
        restore-keys: |
          wp-testenv-${{ runner.os }}-${{ env.WP_VERSION }}-wc-${{ env.WC_VERSION }}-
          wp-testenv-${{ runner.os }}-${{ env.WP_VERSION }}-
          wp-testenv-${{ runner.os }}-

    - name: Set up PHP
      uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
      with:
        php-version: ${{ inputs.php-version }}
        coverage:    xdebug

    - name: Run CI tests with coverage report
      shell: bash
      run: bash bin/run-ci-tests.bash
