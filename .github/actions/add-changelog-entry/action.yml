name: Add changelog entry to a file

inputs:
  CHANGELOG_ENTRY:
    description: 'The changelog entry to add to the file'
    default: ''
  FILENAME:
    description: 'The file to add the changelog entry to'
    default: './changelog.txt'

description: 'Add a changelog entry to a file'
runs:
  using: composite
  steps:
    - name: 'Make script executable'
      shell: bash
      run: chmod +x ${{ github.action_path }}/add-changelog.sh

    - name: 'Add changelog entry to a file'
      shell: bash
      run: ${{ github.action_path }}/add-changelog.sh -e "${{ inputs.CHANGELOG_ENTRY }}" -f "${{ inputs.FILENAME }}"
